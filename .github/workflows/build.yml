name: Test & build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0 or v0.1.0-beta.1). Leave empty to just build."
        required: false
        default: ""

# Least privilege: jobs only get read access unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux, for offscreen UI tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Fetch RNNoise (hash-verified)
        if: runner.os == 'Windows'
        run: python scripts/fetch_rnnoise.py
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Fetch RNNoise (hash-verified)
        run: python scripts/fetch_rnnoise.py
      - name: Generate icon and version info
        run: |
          python scripts/make_icon.py
          python scripts/make_version_info.py
      - name: Build AirDops.exe (portable)
        run: pyinstaller --noconfirm --clean airdops.spec
      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AirDops.exe -ArgumentList '--self-test', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Build installer (per-user, no admin)
        shell: pwsh
        run: |
          $env:AIRDOPS_ONEDIR = "1"
          pyinstaller --noconfirm airdops.spec
          $p = Start-Process -FilePath dist\AirDops\AirDops.exe -ArgumentList '--self-test', "$PWD\selftest-onedir.txt" -Wait -PassThru
          Get-Content selftest-onedir.txt
          if ($p.ExitCode -ne 0) { throw "onedir self-test failed" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          $ver = python -c "import sys; sys.path.insert(0, 'src'); import airdops; print(airdops.__version__)"
          & $iscc /Qp "/DAppVersion=$ver" installer\AirDops.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-Item dist\AirDops-Setup.exe
      - name: Checksum
        shell: pwsh
        run: |
          $lines = foreach ($f in 'AirDops.exe', 'AirDops-Setup.exe') {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $lines | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          Copy-Item selftest.txt dist\selftest.txt
          if (Test-Path previews) { Copy-Item -Recurse previews dist\previews }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AirDops-windows
          path: |
            dist/AirDops.exe
            dist/AirDops-Setup.exe
            dist/SHA256SUMS.txt
            dist/selftest.txt
            dist/previews/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may publish a release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AirDops-windows
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid tag: $TAG" >&2; exit 1
          fi
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/AirDops-Setup.exe dist/AirDops.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "AirDops $TAG" --generate-notes --target "$GITHUB_SHA" $PRE
