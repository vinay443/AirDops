name: Test & build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0 or v0.1.0-beta.1). Leave empty to just build."
        required: false
        default: ""

# Least privilege: jobs only get read access unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux, for offscreen UI tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build RNNoise from pinned Xiph source
        run: python scripts/build_rnnoise.py
      - name: Fetch the old RNNoise build (test reference only, hash-verified)
        shell: bash
        run: echo "AIRDOPS_RNNOISE_REFERENCE=$(python scripts/fetch_rnnoise.py)" >> "$GITHUB_ENV"
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: RNNoise quality vs the old build
        if: always()
        shell: bash
        run: |
          if [ -f build/rnnoise-quality.txt ]; then
            while IFS= read -r line; do echo "::notice title=RNNoise quality (${{ runner.os }})::$line"; done < build/rnnoise-quality.txt
          fi

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build RNNoise from pinned Xiph source
        run: python scripts/build_rnnoise.py
      - name: Generate icon and version info
        run: |
          python scripts/make_icon.py
          python scripts/make_version_info.py
      - name: Build AirDops (folder build, used by the installer and the portable zip)
        shell: pwsh
        run: |
          $env:AIRDOPS_ONEDIR = "1"
          pyinstaller --noconfirm --clean airdops.spec
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AirDops\AirDops.exe -ArgumentList '--self-test', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          Get-Content selftest.txt | ForEach-Object { "::notice title=Self-test::$_" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Measure startup, idle CPU and memory (two runs; the second is warm)
        shell: pwsh
        run: |
          foreach ($i in 1, 2) {
            $p = Start-Process -FilePath dist\AirDops\AirDops.exe -ArgumentList '--bench', "$PWD\bench$i.txt" -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path "bench$i.txt")) { throw "bench run $i failed ($($p.ExitCode))" }
            Get-Content "bench$i.txt" | ForEach-Object { "::notice title=Bench run $i::$_" }
          }
      - name: Portable zip
        shell: pwsh
        run: |
          Push-Location dist
          & 7z a -tzip -mx=9 -mfb=258 -mpass=15 AirDops-portable.zip AirDops | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }
          Pop-Location
      - name: Build installer (per-user, no admin)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          $ver = python -c "import sys; sys.path.insert(0, 'src'); import airdops; print(airdops.__version__)"
          & $iscc /Qp "/DAppVersion=$ver" installer\AirDops.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Checksum
        shell: pwsh
        run: |
          $lines = foreach ($f in 'AirDops-Setup.exe', 'AirDops-portable.zip') {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $lines | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          Copy-Item selftest.txt dist\selftest.txt
          if (Test-Path previews) { Copy-Item -Recurse previews dist\previews }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AirDops-windows
          path: |
            dist/AirDops-Setup.exe
            dist/AirDops-portable.zip
            dist/SHA256SUMS.txt
            dist/selftest.txt
            dist/previews/
          retention-days: 30
      - name: Size report
        run: python scripts/size_report.py --warn-only dist/AirDops dist/AirDops-Setup.exe dist/AirDops-portable.zip

  size-budget:
    # Separate job so a budget failure fails CI without hiding the build's report.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AirDops-windows
          path: dist
      - name: Enforce download size budget
        run: python3 scripts/size_report.py dist/AirDops-Setup.exe dist/AirDops-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, size-budget]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may publish a release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AirDops-windows
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid tag: $TAG" >&2; exit 1
          fi
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/AirDops-Setup.exe dist/AirDops-portable.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "AirDops $TAG" --generate-notes --target "$GITHUB_SHA" $PRE
